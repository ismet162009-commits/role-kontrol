name: Role sure uzatma

# Kartin kendi zamanlayicisi en fazla ~54 dk sayabiliyor.
# Bu is ~10 dakikada bir calisir ve 54 dk'dan uzun sureli acmalari telefon kapali olsa bile devam ettirir.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:        # Actions sekmesinden elle de calistirilabilir

permissions:
  contents: read
  actions: write            # zamanlayiciyi canli tutmak icin

jobs:
  uzat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Sureleri uzat
        env:
          ROLE_KOD: ${{ secrets.ROLE_KOD }}
          MQTT_USER: ${{ secrets.MQTT_USER }}
          MQTT_HOST: broker.hivemq.com
          MQTT_PORT: "1883"
        run: python3 sure_uzat.py

      # GitHub, 60 gun hic degisiklik olmayan herkese acik depolarda zamanlayiciyi durdurur.
      # Ayin 1'inde ve 15'inde zamanlayiciyi yeniden "etkin" yaparak bunu onler.
      - name: Zamanlayiciyi canli tut
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gun=$(date -u +%d)
          if [ "$gun" = "01" ] || [ "$gun" = "15" ]; then
            curl -s -o /dev/null -w "canli tut: %{http_code}\n" -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sure-uzat.yml/enable"
          fi
