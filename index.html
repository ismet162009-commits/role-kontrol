<style>
  :root{--bg:#10141a;--kart:#1b222c;--cizgi:#262f3b;--yazi:#e8edf3;--soluk:#8a96a6;--yesil:#2ecc71;--turuncu:#f39c12;--kirmizi:#e74c3c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--yazi);padding-bottom:env(safe-area-inset-bottom)}
  button{font-family:inherit;cursor:pointer;border:0;color:inherit}
  button:active{transform:scale(.97)}

  header{position:sticky;top:0;z-index:5;background:#0b0f14;padding:calc(10px + env(safe-area-inset-top)) 14px 0;border-bottom:1px solid var(--cizgi)}
  .satir{display:flex;justify-content:space-between;align-items:center;gap:8px}
  h1{font-size:17px;margin:0}
  #saat{font-size:13px;color:var(--soluk)}
  #durum{font-size:12px;margin:4px 0 8px;color:var(--soluk)}
  .nokta{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;background:#888}
  nav{display:flex}
  nav button{flex:1;background:none;padding:10px 0;font-size:14px;color:var(--soluk);border-bottom:2px solid transparent}
  nav button.akt{color:var(--yazi);border-bottom-color:var(--yesil);font-weight:600}

  .sayfa{display:none;padding:12px;max-width:900px;margin:0 auto}
  .sayfa.akt{display:block}

  /* Kontrol */
  .ozet{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;color:var(--soluk)}
  .kirmizi{background:var(--kirmizi);color:#fff;border-radius:9px;padding:8px 12px;font-size:14px}
  #liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
  #liste.pasif{opacity:.45}
  .kanal{background:var(--kart);border-radius:12px;padding:12px;border:2px solid transparent}
  .kanal.on{border-color:var(--yesil)}
  .ust{display:flex;align-items:center;gap:8px}
  .ad{flex:1;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kalan{font-size:12px;color:var(--turuncu);white-space:nowrap}
  .anahtar{width:52px;height:30px;border-radius:15px;background:#3a4452;position:relative;flex-shrink:0;transition:background .2s}
  .anahtar::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
  .on .anahtar{background:var(--yesil)}
  .on .anahtar::after{left:25px}
  .hizli{display:flex;gap:6px;margin-top:10px}
  .hizli button{flex:1;background:#26303c;border-radius:8px;padding:8px 0;font-size:13px;color:var(--soluk)}

  /* Gecmis */
  .gun{font-size:12px;color:var(--soluk);margin:14px 0 4px}
  .gun:first-child{margin-top:0}
  .olay{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--cizgi);font-size:14px}
  .olay .zaman{color:var(--soluk);width:44px;flex-shrink:0}
  .olay .alt{font-size:12px;color:var(--soluk);margin-top:2px}
  .ac{color:var(--yesil)} .kp{color:var(--soluk)} .hk{color:var(--kirmizi)}
  .bos{color:var(--soluk);text-align:center;padding:30px 0;font-size:14px}

  /* Isimler */
  .isim{display:flex;align-items:center;gap:8px;padding:6px 0}
  .isim .no{width:38px;font-size:12px;color:var(--soluk)}
  .isim input[type=text]{flex:1;padding:9px;border-radius:8px;border:1px solid var(--cizgi);background:#0f141a;color:var(--yazi);font-size:15px}
  .isim label{font-size:12px;color:var(--soluk);display:flex;align-items:center;gap:4px;white-space:nowrap}
  .isim.gizlendi input[type=text]{opacity:.45}
  .not{font-size:12px;color:var(--soluk);margin:0 0 8px}
  details{margin-top:24px;font-size:13px;color:var(--soluk)}
  details input{width:100%;padding:8px;border-radius:8px;border:1px solid var(--cizgi);background:#0f141a;color:var(--yazi);font-size:14px;margin:4px 0 8px}
  .yesilBtn{background:#2e7d4f;color:#fff;border-radius:9px;padding:10px 14px;font-size:14px}
  #log{font-family:Consolas,monospace;font-size:11px;word-break:break-all;margin-top:8px}
  .surum{text-align:center;font-size:11px;color:var(--soluk);opacity:.6;margin:20px 0 10px}

  /* Ilk kurulum */
  #kurulum{position:fixed;inset:0;background:#0b0f14f2;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
  #kurulum.goster{display:flex}
  #kurulum .kutu{background:var(--kart);border-radius:14px;padding:18px;width:100%;max-width:360px}
  #kurulum input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--cizgi);background:#0f141a;color:var(--yazi);font-size:16px;margin:10px 0 12px}

  #bilgi{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000d;padding:10px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;z-index:30}
</style>
</head>
<body>
<header>
  <div class="satir"><h1>⚡ Röle Kontrol</h1><span id="saat"></span></div>
  <div id="durum"><span class="nokta"></span>Bağlanıyor…</div>
  <nav>
    <button class="akt" data-sekme="kontrol">Kontrol</button>
    <button data-sekme="gecmis">Geçmiş</button>
    <button data-sekme="isimler">İsimler</button>
  </nav>
</header>

<section class="sayfa akt" id="kontrol">
  <div class="ozet"><span id="ozet">—</span><button class="kirmizi" id="hepsiBtn">Hepsini kapat</button></div>
  <div id="liste"></div>
</section>

<section class="sayfa" id="gecmis">
  <div id="gecmisListe"></div>
</section>

<section class="sayfa" id="isimler">
  <p class="not">İsmi yazın, kutudan çıkınca kaydedilir ve tüm telefonlarda görünür. "Göster" işaretini kaldırdığınız kanal Kontrol sayfasında çıkmaz.</p>
  <div id="isimListe"></div>
  <details>
    <summary>Bağlantı</summary>
    <div style="margin-top:8px">Kartın gizli kodu</div>
    <input id="aKod" type="password" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div>Sunucu</div>
    <input id="aSunucu" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="yesilBtn" id="kaydetBtn">Kaydet ve bağlan</button>
    <div id="log"></div>
  </details>
  <div class="surum">Sürüm 5 · 19.11.2026</div>
</section>

<div id="kurulum"><div class="kutu">
  <b>Kartın gizli kodunu girin</b>
  <div class="not" style="margin-top:6px">Bu telefonda bir kere girmeniz yeterli.</div>
  <input id="kKod" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="gizli kod">
  <button class="yesilBtn" id="kBtn" style="width:100%">Bağlan</button>
</div></div>
<div id="bilgi"></div>

<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script>
// ===================== VARSAYILAN AYARLAR =====================
const VARSAYILAN = { sunucu: "wss://broker.hivemq.com:8884/mqtt", kod: "" };  // gizli kod sayfada DURMAZ
const N = 30;
const KART_MAX_SN = 3270;                         // kartin kendi zamanlayicisi ~54 dk
const HIZLI = [[900,"15 dk"],[1800,"30 dk"],[3600,"1 sa"],[7200,"2 sa"]];
const GECMIS_MAX = 200;
// ==============================================================
const $ = id => document.getElementById(id);
const depo = {
  al(k, v){ try { const x = localStorage.getItem(k); return x === null ? v : JSON.parse(x); } catch(e){ return v; } },
  yaz(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let ayar = Object.assign({}, VARSAYILAN, depo.al("rk_ayar", {}));
const konu = k => ayar.kod + "/" + k;
let isimler = depo.al("rk_isimler", Array.from({length:N}, (_, i) => "Kanal " + (i+1)));
let gizli = depo.al("rk_gizli", []);              // ana sayfada gosterilmeyen kanallar
let gecmis = depo.al("rk_gecmis", []);            // [{z, ch, o, s}]  ch=-1: hepsi
let roleler = Array(N).fill(false);
let sayaclar = depo.al("rk_sayac", {});           // kanal -> bitis zamani (ms)
let yenileme = depo.al("rk_yenileme", {});        // kanal -> karta son sureli komut ani
let istemci = null, bagli = false, sonCevap = 0, baglanmaAni = 0, sonYeniden = 0;

function yayinla(k, veri){ if(istemci && bagli) istemci.publish(konu(k), JSON.stringify(veri), {qos:1, retain:true}); }
function kaydetSayac(paylas){
  depo.yaz("rk_sayac", sayaclar); depo.yaz("rk_yenileme", yenileme);
  if(paylas !== false) yayinla("sayaclar", sayaclar);
}

// ---------- Modbus ----------
function crc16(b){ let c=0xFFFF; for(const x of b){ c^=x; for(let i=0;i<8;i++) c = (c&1) ? (c>>1)^0xA001 : c>>1; } return [c&0xFF, c>>8]; }
const cerceve = a => new Uint8Array([...a, ...crc16(a)]);
const hx = b => Array.from(b).map(x => x.toString(16).padStart(2,"0").toUpperCase()).join(" ");
const KOMUT = {
  ac:     ch => cerceve([1,5,0,ch,0xFF,0]),
  kapat:  ch => cerceve([1,5,0,ch,0,0]),
  oku:    () => cerceve([1,1,0,0,0,N]),
  hepsi:  () => cerceve([1,5,0,0xFF,0,0]),
  sureli: (ch, sn) => { const d = Math.max(1, Math.min(0x7FFF, Math.round(sn*10))); return cerceve([1,5,2,ch,d>>8,d&0xFF]); }
};

// ---------- Baglanti durumu ----------
function kartYok(){ return bagli && Date.now() - baglanmaAni > 10000 && Date.now() - sonCevap > 12000; }
function durumYaz(){
  const d = $("durum"); let renk, yazi, pasif = false;
  if(!ayar.kod){ renk = "#f39c12"; yazi = "Gizli kod girilmedi"; pasif = true; }
  else if(!navigator.onLine){ renk = "#e74c3c"; yazi = "Bu cihazda internet yok"; pasif = true; }
  else if(!bagli){ renk = Date.now() - sonYeniden < 8000 ? "#f39c12" : "#e74c3c";
                   yazi = Date.now() - sonYeniden < 8000 ? "Bağlanıyor…" : "Sunucuya ulaşılamıyor, deneniyor…"; pasif = Date.now() - sonYeniden >= 8000; }
  else if(kartYok()){ renk = "#e74c3c"; yazi = "Kart çevrimdışı (evde elektrik veya internet yok olabilir)"; pasif = true; }
  else if(sonCevap < baglanmaAni){ renk = "#f39c12"; yazi = "Kart bekleniyor…"; }
  else { renk = "#2ecc71"; yazi = "Kart bağlı"; }
  d.innerHTML = '<span class="nokta" style="background:' + renk + '"></span>' + yazi;
  $("liste").classList.toggle("pasif", pasif);
}

// ---------- Komut gonderme ----------
let kuyruk = [], bekleyen = [];
function gonder(b, sessiz){
  if(!ayar.kod){ kurulumAc(); return false; }
  if(kartYok() && !sessiz){ bilgi("Kart çevrimdışı, komut gönderilemedi"); return false; }
  if(!istemci || !bagli){
    if(!sessiz){ kuyruk.push(b); bilgi("Bağlanıyor, komut bağlanınca gönderilecek…"); }
    yenidenBaglan();
    return !sessiz;
  }
  istemci.publish(konu("komut"), b, {qos:0});
  if(b[1] === 5) bekleyen.push({b: Array.from(b).join(","), ham: b, zaman: Date.now(), deneme: (b._deneme || 0)});
  log("→ " + hx(b));
  return true;
}
function kuyruguGonder(){ const k = kuyruk; kuyruk = []; k.forEach(b => gonder(b)); }
setInterval(() => {               // 3 sn icinde onaylanmayan komutu bir kez daha dene
  const simdi = Date.now();
  const geciken = bekleyen.filter(x => simdi - x.zaman > 3000);
  if(!geciken.length) return;
  bekleyen = bekleyen.filter(x => simdi - x.zaman <= 3000);
  const tekrar = geciken.filter(x => x.deneme < 1);
  tekrar.forEach(x => { x.ham._deneme = x.deneme + 1; kuyruk.push(x.ham); });
  bilgi(tekrar.length ? "Komut ulaşmadı, tekrar gönderiliyor…" : "Kart cevap vermiyor");
  sonYeniden = 0; yenidenBaglan();
}, 1000);

// ---------- Gecmis ----------
function olayEkle(ch, o, s){
  gecmis.unshift({z: Date.now(), ch, o, s: s || 0});
  gecmis = gecmis.slice(0, GECMIS_MAX);
  depo.yaz("rk_gecmis", gecmis); yayinla("gecmis", gecmis); gecmisCiz();
}
const ss = t => new Date(t).toLocaleTimeString("tr-TR", {hour:"2-digit", minute:"2-digit"});
function sureYazi(s){ const h = Math.floor(s/3600), m = Math.round(s%3600/60); return (h ? h + " sa " : "") + (m ? m + " dk" : "").trim(); }
function gunAdi(t){
  const g = new Date(t); g.setHours(0,0,0,0); const b = new Date(); b.setHours(0,0,0,0);
  const fark = Math.round((b - g) / 864e5);
  return fark === 0 ? "Bugün" : fark === 1 ? "Dün" : new Date(t).toLocaleDateString("tr-TR", {day:"numeric", month:"long", weekday:"long"});
}
function gecmisCiz(){
  const el = $("gecmisListe");
  if(!gecmis.length){ el.innerHTML = '<div class="bos">Henüz kayıt yok</div>'; return; }
  el.textContent = ""; let sonGun = "";
  for(const x of gecmis){
    const g = gunAdi(x.z);
    if(g !== sonGun){ el.insertAdjacentHTML("beforeend", '<div class="gun"></div>'); el.lastChild.textContent = g; sonGun = g; }
    const ad = x.ch < 0 ? "Hepsi" : (isimler[x.ch] || "Kanal " + (x.ch+1));
    const fiil = x.ch < 0 ? "kapatıldı" : x.o ? "açıldı" : "kapandı";
    let alt = x.ch < 0 ? "" : "CH" + (x.ch+1);
    if(x.o && x.s){ const bit = x.z + x.s*1000; alt += " · " + sureYazi(x.s) + " · " + ss(bit) + (bit > Date.now() ? "'de kapanacak" : "'de kapandı"); }
    else if(x.o) alt += " · süresiz";
    const d = document.createElement("div"); d.className = "olay";
    d.innerHTML = '<div class="zaman"></div><div><div><b></b> <span></span></div><div class="alt"></div></div>';
    d.querySelector(".zaman").textContent = ss(x.z);
    d.querySelector("b").textContent = ad;
    const sp = d.querySelector("span"); sp.textContent = fiil; sp.className = x.ch < 0 ? "hk" : x.o ? "ac" : "kp";
    d.querySelector(".alt").textContent = alt;
    el.appendChild(d);
  }
}

// ---------- Ekran: Kontrol ----------
const liste = $("liste");
for(let i=0;i<N;i++){
  liste.insertAdjacentHTML("beforeend", `
  <div class="kanal" id="k${i}">
    <div class="ust"><span class="ad"></span><span class="kalan" id="g${i}"></span><button class="anahtar" data-i="${i}" aria-label="Aç/kapat"></button></div>
    <div class="hizli">${HIZLI.map(([sn, y]) => `<button data-i="${i}" data-sn="${sn}">${y}</button>`).join("")}</div>
  </div>`);
}
function ciz(){
  let acik = 0;
  for(let i=0;i<N;i++){
    const k = $("k"+i);
    k.classList.toggle("on", roleler[i]);
    k.style.display = gizli.includes(i) ? "none" : "";
    k.querySelector(".ad").textContent = isimler[i];
    if(roleler[i]) acik++;
  }
  $("ozet").textContent = acik ? acik + " cihaz açık" : "Hepsi kapalı";
  sayacCiz();
}
function sayacCiz(){
  const simdi = Date.now();
  for(let i=0;i<N;i++){
    const t = sayaclar[i], el = $("g"+i);
    if(t && t > simdi && roleler[i]){
      const s = Math.round((t - simdi)/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), sn = s%60;
      el.textContent = "⏱ " + (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(sn).padStart(2,"0");
    } else el.textContent = "";
  }
}
liste.addEventListener("click", e => {
  const a = e.target.closest(".anahtar"), h = e.target.closest("[data-sn]");
  if(a){
    const i = +a.dataset.i, yeni = !roleler[i];
    if(gonder(yeni ? KOMUT.ac(i) : KOMUT.kapat(i))){
      delete sayaclar[i]; delete yenileme[i]; kaydetSayac();
      roleler[i] = yeni; ciz(); olayEkle(i, yeni ? 1 : 0);
    }
  } else if(h) sureliAc(+h.dataset.i, +h.dataset.sn);
});
$("hepsiBtn").onclick = () => {
  if(window.confirm("Tüm röleler kapatılsın mı?") && gonder(KOMUT.hepsi())){
    sayaclar = {}; yenileme = {}; kaydetSayac(); roleler.fill(false); ciz(); olayEkle(-1, 0);
  }
};

// ---------- Sureli acma ----------
// <= 54 dk: sureyi KART sayar (sayfa kapansa da zamaninda kapanir).
// > 54 dk: sayfa acik kaldikca 54'er dakikalik parcalarla yenilenir; sayfa kapanirsa role en gec 54 dk icinde kendi kapanir.
function sureliAc(i, sn){
  if(!gonder(KOMUT.sureli(i, Math.min(sn, KART_MAX_SN)))) return;
  sayaclar[i] = Date.now() + sn*1000; yenileme[i] = Date.now(); kaydetSayac();
  roleler[i] = true; ciz(); olayEkle(i, 1, sn);
  bilgi(isimler[i] + " " + sureYazi(sn) + " açıldı");
  setTimeout(() => gonder(KOMUT.oku(), true), 1200);
}
setInterval(() => {
  const simdi = Date.now();
  for(const k in sayaclar){
    const i = +k, kalan = (sayaclar[k] - simdi)/1000;
    if(kalan <= 0){ delete sayaclar[k]; delete yenileme[k]; kaydetSayac(false); continue; }
    const son = yenileme[k] || simdi;
    if(simdi - son >= (KART_MAX_SN - 60)*1000 && kalan > 5 && bagli && !kartYok()){
      if(gonder(KOMUT.sureli(i, Math.min(kalan, KART_MAX_SN)), true)){ yenileme[k] = simdi; kaydetSayac(false); log("CH" + (i+1) + " süresi yenilendi"); }
    }
  }
  sayacCiz(); durumYaz(); saatYaz();
}, 1000);

// ---------- Ekran: Isimler ----------
const isimListe = $("isimListe");
for(let i=0;i<N;i++){
  isimListe.insertAdjacentHTML("beforeend", `
  <div class="isim" id="i${i}"><span class="no">CH${i+1}</span>
    <input type="text" maxlength="30" data-i="${i}">
    <label><input type="checkbox" data-g="${i}"> Göster</label></div>`);
}
function isimCiz(){
  for(let i=0;i<N;i++){
    const r = $("i"+i), inp = r.querySelector("input[type=text]");
    if(document.activeElement !== inp) inp.value = isimler[i];
    r.querySelector("input[type=checkbox]").checked = !gizli.includes(i);
    r.classList.toggle("gizlendi", gizli.includes(i));
  }
}
isimListe.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.i !== undefined){
    const i = +t.dataset.i, v = t.value.trim().slice(0,30) || "Kanal " + (i+1);
    t.value = v; if(v === isimler[i]) return;
    isimler[i] = v; depo.yaz("rk_isimler", isimler); yayinla("isimler", isimler);
    ciz(); gecmisCiz(); bilgi("Kaydedildi");
  } else if(t.dataset.g !== undefined){
    const i = +t.dataset.g;
    gizli = t.checked ? gizli.filter(x => x !== i) : [...new Set([...gizli, i])].sort((a,b) => a-b);
    depo.yaz("rk_gizli", gizli); yayinla("gizli", gizli); ciz(); isimCiz();
  }
});

// ---------- Sekmeler, saat, bilgi ----------
document.querySelector("nav").addEventListener("click", e => {
  const b = e.target.closest("[data-sekme]"); if(!b) return;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("akt", x === b));
  document.querySelectorAll(".sayfa").forEach(x => x.classList.toggle("akt", x.id === b.dataset.sekme));
  if(b.dataset.sekme === "gecmis") gecmisCiz();
  if(b.dataset.sekme === "isimler"){ isimCiz(); $("aKod").value = ayar.kod; $("aSunucu").value = ayar.sunucu; }
  window.scrollTo(0, 0);
});
function saatYaz(){
  const s = new Date();
  $("saat").textContent = s.toLocaleDateString("tr-TR", {day:"numeric", month:"short", weekday:"short"}) + " · " + ss(s);
}
function bilgi(t){ const b = $("bilgi"); b.textContent = t; b.style.opacity = 1; clearTimeout(bilgi.z); bilgi.z = setTimeout(() => b.style.opacity = 0, 2500); }
function log(t){ $("log").textContent = new Date().toLocaleTimeString("tr-TR") + "  " + t; }

// ---------- Gizli kod / baglanti ayarlari ----------
function kurulumAc(){ $("kKod").value = ""; $("kurulum").classList.add("goster"); }
$("kBtn").onclick = () => {
  const k = $("kKod").value.trim(); if(!k) return;
  ayar.kod = k; depo.yaz("rk_ayar", ayar); $("kurulum").classList.remove("goster"); baglan();
};
$("kaydetBtn").onclick = () => {
  ayar = { sunucu: $("aSunucu").value.trim() || VARSAYILAN.sunucu, kod: $("aKod").value.trim() };
  depo.yaz("rk_ayar", ayar);
  if(!ayar.kod) kurulumAc(); else { bilgi("Bağlanılıyor…"); baglan(); }
};

// ---------- MQTT ----------
function yenidenBaglan(){
  if(Date.now() - sonYeniden < 2000) return;
  baglan();
}
function baglan(){
  sonYeniden = Date.now();
  if(typeof mqtt === "undefined"){ $("durum").textContent = "Sayfa tam yüklenemedi, internet bağlantısını kontrol edip sayfayı yenileyin"; return; }
  if(istemci){ try { istemci.removeAllListeners(); istemci.end(true); } catch(e){} }
  bagli = false; bekleyen = [];
  durumYaz();
  istemci = mqtt.connect(ayar.sunucu, {
    clientId: "telefon-" + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 3000, connectTimeout: 10000, keepalive: 30, clean: true
  });
  istemci.on("connect", () => {
    bagli = true; baglanmaAni = Date.now(); durumYaz();
    istemci.subscribe(["cevap","isimler","sayaclar","gecmis","gizli"].map(konu), {qos:0});
    gonder(KOMUT.oku(), true);
    kuyruguGonder();
  });
  istemci.on("close", () => { bagli = false; durumYaz(); });
  istemci.on("error", e => log("Hata: " + (e && e.message)));
  istemci.on("message", (k, msj) => {
    if(k !== konu("cevap")){
      let v; try { v = JSON.parse(new TextDecoder().decode(msj) || "null"); } catch(e){ return; }
      if(k === konu("sayaclar") && v && typeof v === "object"){
        const simdi = Date.now(), yeni = {};
        for(const x in v){ const t = +v[x]; if(t > simdi && +x >= 0 && +x < N) yeni[x] = t; }
        for(const x in yenileme) if(!(x in yeni)) delete yenileme[x];
        for(const x in yeni) if(!(x in yenileme)) yenileme[x] = simdi;
        sayaclar = yeni; kaydetSayac(false); sayacCiz();
      } else if(k === konu("isimler") && Array.isArray(v) && v.length === N){
        isimler = v.map(String); depo.yaz("rk_isimler", isimler); ciz(); isimCiz(); gecmisCiz();
      } else if(k === konu("gizli") && Array.isArray(v)){
        gizli = v.map(Number).filter(x => x >= 0 && x < N); depo.yaz("rk_gizli", gizli); ciz(); isimCiz();
      } else if(k === konu("gecmis") && Array.isArray(v)){
        gecmis = v.filter(x => x && typeof x.z === "number").slice(0, GECMIS_MAX); depo.yaz("rk_gecmis", gecmis); gecmisCiz();
      }
      return;
    }
    const b = new Uint8Array(msj);
    sonCevap = Date.now();
    if(b[1] === 5){ const a = Array.from(b).join(","); bekleyen = bekleyen.filter(x => x.b !== a); }
    log("← " + hx(b));
    if(b.length >= 3 && b[1] === 1){
      for(let i=0;i<N;i++) roleler[i] = !!((b[3 + (i>>3)] >> (i&7)) & 1);
    } else if(b.length >= 6 && b[1] === 5){
      if(b[2] === 0 && b[3] === 0xFF) roleler.fill(b[4] === 0xFF);
      else if(b[2] === 0) roleler[b[3]] = b[4] === 0xFF;
      else if(b[2] === 2) roleler[b[3]] = true;
    } else if(b.length >= 3 && (b[1] & 0x80)) bilgi("Kart hata kodu döndü: " + b[2]);
    ciz(); durumYaz();
  });
}
setInterval(() => { if(bagli) gonder(KOMUT.oku(), true); }, 5000);   // durumu duzenli tazele
// iPhone kilitlenip acilinca baglanti sessizce kopar: ekrana donunce yeniden baglan
document.addEventListener("visibilitychange", () => { if(!document.hidden && ayar.kod) yenidenBaglan(); });
window.addEventListener("pageshow", e => { if(e.persisted && ayar.kod) yenidenBaglan(); });
window.addEventListener("online", () => { if(ayar.kod) yenidenBaglan(); });
window.addEventListener("offline", durumYaz);

saatYaz(); ciz(); isimCiz(); gecmisCiz();
if(!ayar.kod){ kurulumAc(); durumYaz(); } else baglan();
</script>
